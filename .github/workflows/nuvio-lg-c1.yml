name: Nuvio LG C1 - patched webOS IPK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream stable version, e.g. 1.3.7 (blank = highest stable tag)'
        required: false
        type: string
      force_rebuild:
        description: 'Rebuild even if this version already has a custom release'
        type: boolean
        default: false
  schedule:
    - cron: '27 5 * * *' # Daily; only builds newly tagged versions.

permissions:
  contents: write # Creates downloadable custom IPK releases on YOUR fork.

concurrency:
  group: nuvio-c1-custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out customizations from my fork
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Resolve latest stable upstream tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            # 'releases/latest' can lag behind the app update feed; use published
            # stable Git tags. Never auto-select a prerelease tag.
            tag="$(gh api --paginate 'repos/NuvioMedia/NuvioTVSmart/tags?per_page=100' \
              --jq '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          fi
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Selected upstream tag $tag"

      - name: Skip release if already built
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FORCE: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE" != 'true' ]] && gh release view "c1-${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "c1-${TAG} was built previously. Nothing to do."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout EXACT upstream release tag
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTVSmart
          ref: ${{ steps.version.outputs.tag }}
          path: nuvio

      - name: Apply all local patches (stop on conflict)
        if: steps.existing.outputs.skip != 'true'
        working-directory: nuvio
        shell: bash
        run: |
          set -euo pipefail
          for p in nuvio_webos_reliability.patch nuvio_webos_ui_performance.patch nuvio_home_performance_v2.patch nuvio_c1_polish_v2.patch; do
            echo "Checking and applying $p"
            git apply --check "$GITHUB_WORKSPACE/custom/custom-patches/$p"
            git apply "$GITHUB_WORKSPACE/custom/custom-patches/$p"
          done
          git diff --check

      - name: Setup Node.js
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nuvio/package-lock.json

      - name: Apply login recovery (QR/manual/Back)
        if: steps.existing.outputs.skip != 'true'
        working-directory: nuvio
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/custom/custom-patches/apply_login_recovery.py"
          node --check js/ui/screens/account/authQrSignInScreenMethods-02-bind-controls.js
          node --check js/ui/screens/account/authQrSignInScreenMethods-03-to-friendly-email-error.js
          git diff --check
      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        working-directory: nuvio
        run: npm ci

      - name: Run targeted reliability and artwork tests
        if: steps.existing.outputs.skip != 'true'
        working-directory: nuvio
        shell: bash
        run: |
          set -euo pipefail
          node --test js/platform/webos/webosCompanionService.test.mjs
          node --test js/ui/screens/search/searchPosterHydration.test.mjs
          node --test js/ui/images/tvPosterRescalerWarmCache.test.mjs js/ui/screens/home/homeImageCommitQueue.test.mjs
          node --test js/ui/images/tvPosterRescalerPool.test.mjs js/ui/screens/home/homeArtworkLifecycle.test.mjs

      - name: Lint and build webOS package
        if: steps.existing.outputs.skip != 'true'
        working-directory: nuvio
        shell: bash
        run: |
          set -euo pipefail
          npm run lint:runtime
          # Build our patched code first.
          npm run build

          # Retrieve the configured runtime from the matching
          # official Nuvio release. Never print its contents.
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p official-ipk
          GH_TOKEN="${{ github.token }}" gh release download "$TAG" \
            --repo NuvioMedia/NuvioTVSmart \
            --pattern "NuvioTV-webOS-${TAG}.ipk" \
            --dir official-ipk

          IPK="official-ipk/NuvioTV-webOS-${TAG}.ipk"
          DATA="$(ar t "$IPK" | grep '^data\.tar' | head -n 1)"
          test -n "$DATA" || { echo "Official IPK archive missing"; exit 1; }
          ar p "$IPK" "$DATA" > "official-ipk/$DATA"

          ENV_PATH="$(tar -tf "official-ipk/$DATA" | grep -E '(^|/)nuvio\.env\.js$' | head -n 1)"
          test -n "$ENV_PATH" || { echo "Runtime config missing"; exit 1; }
          tar -xOf "official-ipk/$DATA" "$ENV_PATH" > dist/nuvio.env.js

          # Validate required settings without exposing their values.
          node -e 'const fs=require("fs"),vm=require("vm"),s={};vm.runInNewContext(fs.readFileSync("dist/nuvio.env.js","utf8"),s);if(!s.__NUVIO_ENV__?.NUVIO_SUPABASE_URL||!s.__NUVIO_ENV__?.NUVIO_SUPABASE_ANON_KEY)process.exit(1)'

          # Package the patched build without regenerating the env.
          node ./scripts/package-webos.mjs

          # Verify the FINAL IPK, not just dist/. Fail safely if login breaks.
          BUILT_IPK="space.nuvio.webos_${{ steps.version.outputs.tag }}_all.ipk"
          test -f "$BUILT_IPK"
          BUILT_DATA="$(ar t "$BUILT_IPK" | grep '^data\.tar' | head -n 1)"
          test -n "$BUILT_DATA" || { echo "::error::Built IPK has no data archive"; exit 1; }
          mkdir -p package-check
          ar p "$BUILT_IPK" "$BUILT_DATA" > "package-check/$BUILT_DATA"
          BUILT_TAR="package-check/$BUILT_DATA"
          tar -tf "$BUILT_TAR" > package-check/contents.txt

          for name in nuvio.env.js app.bundle.js assets/libs/qrcode-generator.js; do
            grep -Eq "(^|/)${name//./[.]}$" package-check/contents.txt || {
              echo "::error::Final IPK missing $name"
              exit 1
            }
          done
          ENV_PATH="$(grep -E '(^|/)nuvio\.env\.js$' package-check/contents.txt | head -n 1)"
          tar -xOf "$BUILT_TAR" "$ENV_PATH" | node -e '
            const vm = require("vm");
            let source = "";
            process.stdin.on("data", chunk => source += chunk);
            process.stdin.on("end", () => {
              const sandbox = {};
              vm.runInNewContext(source, sandbox);
              const env = sandbox.__NUVIO_ENV__ || {};
              if (!env.NUVIO_SUPABASE_URL || !env.NUVIO_SUPABASE_ANON_KEY || !env.DEVICE_LOGIN_WEB_BASE_URL) {
                console.error("Final IPK is missing required QR authentication configuration");
                process.exit(1);
              }
              console.log("Final IPK authentication configuration validated (values hidden)");
            });
          '
          QR_PATH="$(grep -E '(^|/)assets/libs/qrcode-generator\.js$' package-check/contents.txt | head -n 1)"
          test "$(tar -xOf "$BUILT_TAR" "$QR_PATH" | wc -c)" -gt 2000 || {
            echo "::error::QR library missing or truncated"
            exit 1
          }
          sha256sum "$BUILT_IPK" > checksums.sha256

      - name: Upload IPK as build artifact
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-lg-c1-${{ steps.version.outputs.tag }}
          path: |
            nuvio/space.nuvio.webos_${{ steps.version.outputs.tag }}_all.ipk
            nuvio/checksums.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish persistent custom release on my fork
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "c1-${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists. Leaving it untouched; new build is in Actions artifacts.'
            exit 0
          fi
          gh release create "c1-${TAG}" \
            "nuvio/space.nuvio.webos_${TAG}_all.ipk" \
            'nuvio/checksums.sha256' \
            --repo "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio ${TAG} - LG C1 patched" \
            --notes 'Built from the upstream Nuvio tag with custom webOS reliability, Search and Home optimization patches. Patch conflicts, tests and lint fail the build. Not an official Nuvio release. Install manually over the previous app; retain your working IPK for rollback.' \
            --latest=false
